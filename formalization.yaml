# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"

project:
  name: "Certified naturality, transport, and non-collapse in a typed two-dimensional lambda calculus"
  description: >-
    A Lean 4 formalization of labelled conversion evidence and the declared
    two-dimensional cell generators from A Theory of a Two-Dimensional Typed
    Lambda Calculus. A structural-recursive evaluator for a seven-constructor
    language of presented homotopies computes pointwise evidence together with
    naturality certificates; finite presentations have direct naturality, and
    conjugation transport respects two-paths and reconstructs the same square.
    An explicit semantic family proves that presented homotopies form a proper
    subclass of pointwise families. Separately, Boolean parity is invariant
    under every cell and separates beta from eta evidence with common endpoints,
    yielding a nontrivial beta-eta loop.
    Extensions add standalone typed de Bruijn syntax with representation
    adequacy and a parity-preserving evidence interpretation, and an independent
    classical refutation of unrestricted naturality by a dihedral-group invariant.
  authors:
    - "Arthur F. Ramos"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Arthur F. Ramos"

classification:
  arxiv: ["math.LO"]
  msc2020: ["03B40", "03B38"]

sources:
  - title: "A Theory of a Two-Dimensional Typed Lambda Calculus"
    authors:
      - "Daniel O. Martínez-Rivillas"
      - "Arthur F. Ramos"
      - "Ruy J. G. B. de Queiroz"
    type: "paper"
    relationship: "formalizes"
    note: >-
      The Lean development formalizes the labelled steps, paths, declared Step2
      generator set, canonical evaluator and its equations, certified naturality,
      finite-presentation transport and recovery, a proper-subclass obstruction,
      parity preservation, beta-eta separation, and the nontrivial-loop
      consequence from the manuscript dated 13 September 2026.
    license: "unknown"
    author_endorsement: "participated"

status:
  scope: >-
    Formalizes Definitions 2.1, 2.2, 3.1, 5.1, 5.2, 5.5, and 6.3; Theorems
    5.3 and 6.2; finite-presentation transport results corresponding to Proposition 6.4 and Theorems
    6.6 through 6.8; Theorem 7.3; Corollary 7.5; and its nontrivial-loop
    consequence. Also proves unrestricted-naturality nonexistence through a new
    classical invariant, rather than porting the claimed constructive Idris proof.
    Adds standalone typed syntax, representation adequacy, substitution soundness,
    and a parity-preserving conversion interpretation. Does not claim
    normalization or denotational completeness; a semantic higher-lambda-model
    interpretation; an infinity-groupoid; or a fundamental-group calculation.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Quot.sound", "Classical.choice"]
  main_results:
    - "TDLC.evalHomotopyStepI"
    - "TDLC.certifiedStepNaturality"
    - "TDLC.certifiedPathNaturality"
    - "TDLC.transportAlongPresented"
    - "TDLC.transportAlongPresentedRespects"
    - "TDLC.certifiedTransport"
    - "TDLC.certifiedNaturalityViaTransport"
    - "TDLC.transportAlongPathI"
    - "TDLC.transportAlongPathIRespects"
    - "TDLC.certifiedPathTransport"
    - "TDLC.recoverNaturalityFromPathTransport"
    - "TDLC.certifiedPathNaturalityViaTransport"
    - "TDLC.semanticFamilyNotPresented"
    - "TDLC.step2PreservesParity"
    - "TDLC.path2PreservesParity"
    - "TDLC.betaEtaSeparated"
    - "TDLC.betaEtaLoopNontrivial"
    - "TDLC.Syntax.representationAdequacy"
    - "TDLC.Syntax.eval_subst"
    - "TDLC.Syntax.interpret_parity"
    - "TDLC.Syntax.Example.interpretedRoutesSeparated"
    - "TDLC.Refutation.cell_preserves"
    - "TDLC.Refutation.noBadPath2"
    - "TDLC.Refutation.notStepNat"
    - "TDLC.Refutation.notNatPath"

automation:
  methods:
    - method: "agent"
      models: ["OpenAI GPT-6", "OpenAI GPT-5"]
      framework: "OpenAI Codex"
      tool_setup: >-
        The agent translated the manuscript definitions into Lean, developed
        the structural-recursion proofs and certificate constructions, prepared
        the Palomar boundary, and ran local verification under human direction.
      cost:
        wall_time: "one interactive development session"
        spend_usd: "subscription-based"
        hardware: "local macOS machine and GitHub Actions"
      prompting_notes: >-
        The human supplied the manuscript, requested feasibility assessment,
        and authorized creation of a public repository and formalization.
  spend_usd: "subscription-based"
  notes: >-
    The mathematical source and Palomar scope were selected with the human;
    Codex produced and checked the Lean implementation and repository package.

fidelity:
  divergences: >-
    The Lean encoding keeps all object types in one universe level at a time
    and places inspectable evidence one universe higher. As in the manuscript's
    Idris host encoding, beta and eta make endpoint expressions definitionally
    equal in the host theory while preserving their constructor tags as data.
    The new unrestricted-naturality refutation is a classical Lean proof via a
    noncommutative invariant; it is not a port or verification of the claimed
    constructive Idris proof, whose sources were not provided. Syntax.lean is
    an additional standalone encoding. Its adequacy theorem concerns raw-tree
    representation, not full abstraction or denotational completeness. The
    interpretation preserves conversion parity and the displayed separation.
    The core proper-subclass obstruction remains valid. Transport and direct naturality
    cover arbitrary finite global presentations. The transport comparison uses
    step naturality and is not an independent proof of it. No claim outside the stated scope is
    represented as a Lean theorem.

review:
  status: "agent-reviewed"
  reviewers:
    - "OpenAI Codex"
  notes: >-
    The agent audited every Step2 constructor against Definition 3.1, checked
    every evaluator branch and transport boundary, checked parity preservation
    case by case, kept the Palomar Challenge independent of candidate-local
    imports, and ran the repository verification scripts.
    Lean's #print axioms reports no axioms for the 35 audited core declarations;
    the core Comparator export configuration permits propext because the exported
    Lean environment declares it and NanoDa requires that declaration to be
    allowlisted.
    The 17 extension declarations are audited separately against exactly the
    standard propext, Quot.sound, and Classical.choice allowlist. Independent
    Comparator/NanoDa configurations preserve this distinction.

alignment:
  namespace: "TDLC"
  statements:
    - source: "Additional Lean result: standalone syntax representation adequacy"
      lean: "TDLC.Syntax.representationAdequacy"
      module: "Syntax"
      status: "proved"
      note: "Exactly the extrinsically well-typed annotated raw trees have intrinsic representatives."
    - source: "Additional Lean result: evidence interpretation"
      lean: "TDLC.Syntax.interpret_parity"
      module: "Syntax"
      status: "proved"
      note: "Syntactic conversions map to host evidence with the same structural parity."
    - source: "Section 5 unrestricted-naturality refutation"
      lean: "TDLC.Refutation.notStepNat"
      module: "Refutation"
      status: "proved"
      note: "Independent classical proof; the manuscript's claimed constructivity is not verified."
    - source: "Section 5 path-naturality refutation"
      lean: "TDLC.Refutation.notNatPath"
      module: "Refutation"
      status: "proved"
      note: "Rules out even finite Path2-valued naturality, hence also single-Step2-valued naturality."
    - source: "Theorem 5.3, canonical certified evaluation"
      lean: "TDLC.evalHomotopyStepI"
      module: "Solution"
      status: "proved"
      note: >-
        A computable definition covering all seven presentation constructors;
        seven separately compared equations expose the computed family.
    - source: "Corollary 5.4, naturality of evaluated step homotopies"
      lean: "TDLC.certifiedStepNaturality"
      module: "Solution"
      status: "proved"
      note: "Projects the naturality witness constructed by the canonical evaluator."
    - source: "Theorem 6.2, direct naturality for finite presentations"
      lean: "TDLC.certifiedPathNaturality"
      module: "Solution"
      status: "proved"
      note: "Produces an explicit Path2 witness for every HomotopyPathI presentation."
    - source: "Proposition 6.4, transport respects two-paths"
      lean: "TDLC.transportAlongPathIRespects"
      module: "Solution"
      status: "proved"
      note: "Recursive transport preserves two-paths for every finite global presentation."
    - source: "Theorems 6.6 through 6.8, transport and recovery"
      lean: "TDLC.certifiedPathNaturalityViaTransport"
      module: "Solution"
      status: "proved"
      note: >-
        Conjugation transport maps source congruence to target congruence and
        recovers the naturality boundary for arbitrary finite global presentations.
        The comparison is derived from step naturality, not independent of it.
    - source: "Definition 5.1, presented versus semantic homotopies"
      lean: "TDLC.semanticFamilyNotPresented"
      module: "Solution"
      status: "proved"
      note: >-
        An explicit Bool-indexed family varies its outer evidence constructor,
        whereas every canonical global presentation is uniform at that level.
    - source: "Theorem 7.3, preservation by all 2-cells"
      lean: "TDLC.step2PreservesParity"
      module: "Solution"
      status: "proved"
      note: "Covers every constructor of the formalized Step2 family."
    - source: "Theorem 7.3, preservation by Path2 sequences"
      lean: "TDLC.path2PreservesParity"
      module: "Solution"
      status: "proved"
      note: "Composes preservation along an explicit finite sequence of cells."
    - source: "Corollary 7.5, beta and eta evidence are distinct"
      lean: "TDLC.betaEtaSeparated"
      module: "Solution"
      status: "proved"
      note: "States nonexistence of a Step2 witness for the selected common-source pair."
    - source: "Corollary 7.5, beta-eta loop consequence"
      lean: "TDLC.betaEtaLoopNontrivial"
      module: "Solution"
      status: "proved"
      note: "States nonexistence of a Path2 witness from the loop to the empty path."

acknowledgements: >-
  The formalization follows the manuscript by Daniel O. Martínez-Rivillas,
  Arthur F. Ramos, and Ruy J. G. B. de Queiroz and uses Lean 4, Comparator,
  lean4export, NanoDa, Landrun, and the Palomar submission infrastructure.
